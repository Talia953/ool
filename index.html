<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思维导图整理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#F5F2EA;
    --surface:#FFFFFF;
    --surface-2:#FBF9F4;
    --border:#E4DECF;
    --border-strong:#D7CFB8;
    --ink:#232019;
    --ink-line:#8C8367;
    --muted:#8B8370;
    --note:#2158D6;
    --highlight:#FFE58A;
    --danger:#B3402F;
    --accent:#33306E;
    --radius:10px;
    --shadow:0 1px 2px rgba(37,34,25,.06), 0 8px 24px -12px rgba(37,34,25,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(37,34,25,0.035) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif; font-weight:700; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:#FFE58A;}

  #app{max-width:1160px; margin:0 auto; padding:20px 20px 80px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 20px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-mark{width:38px; height:38px; border-radius:9px; background:linear-gradient(155deg,var(--accent),#5B4FD1); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Songti SC",serif; font-size:19px; flex:none; box-shadow:0 3px 8px -2px rgba(59,54,144,.55);}
  #docTitle{font-size:20px; outline:none; border:none; background:transparent; min-width:60px; max-width:420px; border-bottom:1px dashed transparent; padding:2px 1px;}
  #docTitle:focus{border-bottom-color:var(--border-strong);}
  .tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:9px; border:1px solid var(--border); flex-wrap:wrap;}
  .tab{border:none; background:transparent; padding:8px 14px; border-radius:6px; font-size:13.5px; font-weight:600; color:var(--muted); white-space:nowrap;}
  .tab.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}

  main{margin-top:18px;}
  .sub-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .sub-tab{border:1px solid var(--border-strong); background:var(--surface); color:var(--muted); padding:8px 16px; border-radius:8px; font-size:13.5px; font-weight:600;}
  .sub-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px;}
  .panel + .panel{margin-top:16px;}
  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .panel-head h2{font-size:17px; color:var(--ink);}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.7;}
  .toolbar-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); padding:7px 13px; border-radius:7px; font-size:13px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#28255C;}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted);}
  .btn.ghost:hover{background:var(--surface-2); color:var(--ink);}
  .btn.small{padding:4px 9px; font-size:12px; border-radius:6px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Plain content-input outline ---------- */
  .input-list{margin-top:14px;}
  .input-row{margin-top:7px;}
  .input-line{display:flex; align-items:flex-start; gap:6px; flex-wrap:wrap;}
  .input-collapse{flex:none; width:16px; height:16px; margin-top:6px; border:none; background:transparent; color:var(--muted); font-size:10px; border-radius:4px;}
  .input-collapse:hover{background:var(--surface-2);}
  .input-num{flex:none; color:var(--muted); font-size:13px; min-width:20px; margin-top:8px;}
  .input-line textarea.input-text{flex:1 1 220px; min-width:160px; max-width:480px; padding:7px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:14px; color:var(--ink); background:var(--surface); font-family:inherit; line-height:1.5; resize:none; overflow:hidden;}
  .input-row.lvl-1 > .input-line textarea.input-text{font-weight:700; font-size:15.5px;}
  .input-line input.input-note{flex:1 1 160px; min-width:120px; max-width:280px; padding:6px 9px; border:1px dashed var(--border-strong); border-radius:6px; font-size:12px; color:var(--note); background:#FBFCFF; align-self:flex-start; margin-top:1px;}
  .input-line input.input-note::placeholder{color:#B7C3EE;}
  .input-children{margin-left:20px; padding-left:14px; border-left:1.5px dashed var(--border-strong); margin-top:2px;}
  .input-mini{display:flex; gap:1px; flex:none; align-self:flex-start; margin-top:2px;}

  /* ---------- Brace / bracket tree (generated diagram) ---------- */
  .tree-scroll{overflow-x:auto; padding:14px 4px 22px;}
  .tree-root{display:flex; min-width:min-content;}
  .brace-row{display:flex; align-items:flex-start;}
  .label-block{align-self:center; display:flex; flex-direction:column; gap:3px; padding:3px 0; min-width:0; max-width:620px;}
  .label-line{display:flex; align-items:baseline; gap:4px;}
  .num-prefix{color:var(--ink); opacity:.68; user-select:none; flex:none;}
  .label-text{outline:none; word-break:break-word; line-height:1.55; white-space:normal; color:var(--ink); font-weight:400;}
  .label-text:focus{background:#FBF9F4; border-radius:4px;}
  .root-label{max-width:none;}
  .root-text{
    font-size:20px; font-weight:700; font-family:"Songti SC","STSong",Georgia,serif; color:var(--ink); outline:none;
    writing-mode:vertical-rl; text-orientation:upright; letter-spacing:3px; padding:2px 0;
  }

  .mini-toolbar{display:none; align-items:center; gap:1px; flex-wrap:wrap;}
  .label-block:hover .mini-toolbar, .label-block:focus-within .mini-toolbar{display:flex;}
  .tbtn{flex:none; min-width:19px; height:19px; padding:0 4px; border-radius:5px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .tbtn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--border);}
  .tbtn:disabled{opacity:.3; cursor:not-allowed;}
  .tbtn:disabled:hover{background:transparent; border-color:transparent;}
  .tbtn.underline{text-decoration:underline;}
  .tbtn.del:hover{background:#FBE6E1; color:var(--danger); border-color:#F1C6BB;}
  .voice-btn{border-color:var(--border-strong);}
  .voice-btn.recording{background:var(--danger); border-color:var(--danger); color:#fff; animation:voice-pulse 1.1s ease-in-out infinite;}
  .voice-btn.transcribing{background:var(--accent); border-color:var(--accent); color:#fff; opacity:.85;}
  .voice-btn.recording.transcribing{background:linear-gradient(90deg, var(--danger), var(--accent)); border-color:var(--accent); opacity:1;}
  @keyframes voice-pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,64,47,.45);} 50%{box-shadow:0 0 0 5px rgba(179,64,47,0);}}
  .voice-settings{font-size:12.5px; color:var(--muted); margin-top:10px; padding:9px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;}
  .voice-settings-summary{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;}
  .voice-settings-label{font-weight:700; color:var(--ink);}
  .voice-settings-toggle{color:var(--accent); font-weight:600; flex:none;}
  .voice-settings-body{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-strong);}
  .voice-settings-body label{display:flex; align-items:center; gap:5px; font-weight:500;}
  .voice-settings-body .hint{flex-basis:100%;}
  select.sizesel{height:19px; font-size:10px; border-radius:5px; border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:0 1px;}

  .node-note{margin-top:1px; font-size:12px; color:var(--note); font-style:italic; outline:none; max-width:340px; padding:1px 2px; border-radius:4px;}
  .node-note:empty:before{content:attr(data-placeholder); color:#AAB4E6; font-style:italic;}
  .node-note:focus{background:#F0F4FF;}
  .note-x{font-size:10px; color:var(--muted); margin-left:5px; cursor:pointer;}

  .brace-stub{align-self:center; flex:none; width:12px; height:2px; background:var(--ink-line); opacity:.65; margin:0 1px;}
  .brace-connector{align-self:center; flex:none; width:20px;}
  .brace-connector svg{display:block; width:100%; height:100%;}
  .brace-connector svg path{fill:none; stroke:var(--ink-line); stroke-width:1.7; stroke-linejoin:miter; opacity:.8;}
  .brace-children{align-self:center; display:flex; flex-direction:column; justify-content:center; gap:13px; flex:none;}

  .recite-box{border:1.5px dashed var(--border-strong); border-radius:8px; padding:8px 12px; color:var(--muted); font-size:12px; max-width:280px; align-self:center; background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 8px,var(--surface) 8px,var(--surface) 16px);}

  .empty-state{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px;}

  /* ---------- Recite: click-to-pick content ---------- */
  .pick-toggle{margin-left:6px; font-size:11px; border:1px solid var(--border-strong); border-radius:6px; padding:2px 8px; background:var(--surface); color:var(--muted); font-weight:600;}
  .pick-toggle.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---------- Blank / cloze practice ---------- */
  .blank-toolbar{position:sticky; top:10px; z-index:20; background:var(--surface); padding:10px 12px; border-radius:9px; box-shadow:var(--shadow); border:1px solid var(--border); margin-top:4px;}
  .blank-wrap{display:inline-flex; align-items:center; gap:2px; vertical-align:baseline;}
  .blank-slot{display:inline-block; min-width:2.4em; padding:0 3px; border-bottom:2px solid var(--ink); text-align:center; color:var(--accent); font-weight:600; cursor:pointer;}
  .blank-slot.revealed{border-bottom-style:dashed; color:var(--danger);}
  .blank-restore{font-size:10px; color:var(--muted); cursor:pointer; opacity:0; transition:opacity .15s; padding:0 2px; user-select:none;}
  .blank-wrap:hover .blank-restore{opacity:1;}
  .blank-restore:hover{color:var(--danger);}

  /* ---------- Glossary (名词解释) ---------- */
  .apikey-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .apikey-row input{flex:1 1 260px; min-width:200px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:7px; font-size:13px;}
  .glossary-row{border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-top:10px; background:var(--surface-2);}
  .glossary-top{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .glossary-term{flex:1 1 200px; min-width:160px; padding:7px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:14px; font-weight:600; color:var(--ink);}
  .glossary-explain{width:100%; margin-top:8px; min-height:64px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; line-height:1.65; font-family:inherit; resize:vertical; color:var(--ink); background:#fff;}

  /* ---------- Export form ---------- */
  .form-row{margin-top:14px;}
  .form-row label{display:block; font-size:13px; font-weight:700; margin-bottom:6px;}
  .form-row input[type=text]{width:100%; max-width:420px; padding:9px 11px; border:1px solid var(--border-strong); border-radius:7px; font-size:14px;}
  .radio-group{display:flex; gap:18px; flex-wrap:wrap;}
  .radio-group label{display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500;}
  .wm-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  /* ---------- Export history ---------- */
  .history-folder{margin-top:16px;}
  .history-folder-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-bottom:6px; border-bottom:1.5px solid var(--border-strong);}
  .history-folder-name{font-weight:700; font-size:14px; outline:none; padding:2px 5px; border-radius:5px; cursor:text;}
  .history-folder-name:focus{background:var(--surface-2);}
  .history-folder-count{font-size:12px; color:var(--muted);}
  .history-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); margin-top:8px; flex-wrap:wrap;}
  .history-title{font-weight:700; font-size:13.5px;}
  .history-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .history-move-sel{font-size:11.5px; padding:5px 6px; border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); color:var(--muted);}

  /* ---------- Modal / preview ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(24,22,15,.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:26px;}
  .modal-box{background:#DCD7C8; border-radius:12px; max-width:960px; width:100%; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:#fff; border-radius:12px 12px 0 0; border-bottom:1px solid var(--border);}
  .modal-head h3{font-size:15px;}
  .modal-body{overflow:auto; padding:26px; display:flex; flex-direction:column; align-items:center; gap:16px;}
  .modal-foot{padding:14px 20px; background:#fff; border-radius:0 0 12px 12px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
  .doc-page-frame{background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.25);}

  @media (max-width:720px){
    #app{padding:12px 10px 60px;}
    .topbar{padding:10px 12px;}
    #docTitle{font-size:16px; max-width:150px;}
    .tab{padding:7px 10px; font-size:12px;}
    .label-block{max-width:220px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">思</div>
      <h1 id="docTitle" contenteditable="true" spellcheck="false"></h1>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-tab="edit">整理</button>
      <button class="tab" data-tab="recite">背诵</button>
      <button class="tab" data-tab="glossary">名词解释</button>
      <button class="tab" data-tab="export">导出</button>
    </div>
  </div>
  <main id="viewport"></main>
</div>
<div id="modalRoot"></div>

<script>
/* =========================================================
   State & data model
   node = { id, html, note, level, fontSize, collapsed, children:[] }
   ========================================================= */
let idCounter = 1;
const LEVEL_DEFAULT_SIZE = {1:20,2:16,3:15,4:14,5:13};
const FONT_SIZES = [12,13,14,15,16,18,20,22,24,26,28,32];
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];

function letterSeq(idx){
  let s='', n=idx+1;
  while(n>0){ n--; s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26); }
  return s;
}
function numberPrefix(level, idx){
  if (level===2) return (idx+1)+'、';
  if (level===3) return CIRCLED[idx] || `(${idx+1})`;
  if (level===4) return `（${idx+1}）`;
  if (level===5) return letterSeq(idx)+'、';
  return '';
}
function bumpIdCounterFromId(id){
  const m = /^[a-z]+(\d+)$/.exec(id||'');
  if (m){ const v = parseInt(m[1],10); if (v+1>idCounter) idCounter = v+1; }
}

function newNode(level, html){
  return {
    id:'n'+(idCounter++),
    html: html !== undefined ? html : '',
    note:'',
    level,
    fontSize: LEVEL_DEFAULT_SIZE[level] || 13,
    collapsed:false,
    children:[]
  };
}
// Marker + helpers used to embed/recover the exact node tree inside a PDF
// this tool exports, so re-importing that same PDF later can restore it
// with perfect hierarchy instead of guessing from the flattened picture.
const MINDMAP_EMBED_MARKER = 'MINDMAP_TOOL_DATA_V1:';
function serializeNodesForEmbed(nodes){
  return (nodes||[]).map(n=>({
    html:n.html, note:n.note||'', level:n.level, fontSize:n.fontSize,
    children: serializeNodesForEmbed(n.children||[])
  }));
}
function nodesFromPlain(arr){
  return (arr||[]).map(o=>{
    const node = newNode(o.level||1, o.html||'');
    node.note = o.note||'';
    if (o.fontSize) node.fontSize = o.fontSize;
    node.children = nodesFromPlain(o.children||[]);
    return node;
  });
}
function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').trim();
}
function htmlToPlainLines(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('br').forEach(br=> br.replaceWith('\n'));
  return (d.textContent || '');
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function normalizeBlanksForExport(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('.blank-slot').forEach(s=>{
    s.textContent = '';
    s.classList.remove('revealed');
    s.removeAttribute('title');
  });
  d.querySelectorAll('.blank-restore').forEach(b=> b.remove());
  return d.innerHTML;
}
function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ console.error(e); return false; }
}
function loadApiKey(){
  try{ return localStorage.getItem('mindmap_deepseek_key') || ''; }catch(e){ return ''; }
}
function saveApiKeyToStorage(key){
  try{ localStorage.setItem('mindmap_deepseek_key', key); }catch(e){}
}
function formatTime(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function demoData(){
  idCounter = 1;
  const bg = newNode(1,'背景');
  bg.children = [
    newNode(2,'世界：主要资本主义国家开展工业革命，抢占原料产地和商品市场'),
    newNode(2,'中国：清政府落后腐朽'),
    newNode(2,'根本原因：工业革命下，西方需要广阔的原料产地和商品市场'),
    newNode(2,'直接原因：1839年林则徐虎门销烟')
  ];

  const p1 = newNode(2,'第一阶段 (1840.6—1841.1)');
  p1.children = [
    newNode(3,'路线：珠江口→厦门→定海→天津白河口'),
    newNode(3,'清廷态度：支持抵抗→林则徐被撤职查办→妥协投降→和谈出卖利益')
  ];
  const p2 = newNode(2,'第二阶段 (1841.1—1842.8)');
  p2.children = [
    newNode(3,'路线：香港岛→广州（三元里抗英）→厦门→台湾→定海→吴淞（陈化成）→镇江→南京'),
    newNode(3,'清廷态度：战败求和')
  ];
  const proc = newNode(1,'过程');
  proc.children = [p1,p2];

  const nj = newNode(2,'中英《南京条约》(1842年)');
  const c1=newNode(3,'割香港岛给英国');
  const c2=newNode(3,'赔款2100万两银元');
  const c3=newNode(3,'协定关税，开设五口通商'); c3.note='广州、福建、宁波、上海、厦门';
  nj.children=[c1,c2,c3];
  const hm = newNode(2,'《虎门条约》《五口通商章程》(1843年)');
  hm.note='攫取领事裁判权、片面最惠国待遇等特权';
  const us = newNode(2,'中美《望厦条约》(1844年)');
  const fr = newNode(2,'中法《黄埔条约》(1844年)');
  const res = newNode(1,'结果：不平等条约的签订');
  res.children=[nj,hm,us,fr];

  const inf = newNode(1,'影响');

/* =========================================================
   DOM helpers
   ========================================================= */
function el(tag, attrs, children){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs){
    const v = attrs[k];
    if (v===undefined || v===null) continue;
    if (k==='class') e.className = v;
    else if (k==='style') Object.assign(e.style, v);
    else if (k.indexOf('on')===0 && typeof v==='function') e.addEventListener(k.slice(2), v);
    else if (k==='html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(children)?children:children!=null?[children]:[]).forEach(c=>{
    if (c===null || c===undefined) return;
    if (typeof c==='string' || typeof c==='number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function svgEl(tag, attrs){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function locate(id, nodes){
  nodes = nodes || state.nodes;
  for (let i=0;i<nodes.length;i++){
    if (nodes[i].id===id) return {arr:nodes, idx:i, node:nodes[i]};
    const found = locate(id, nodes[i].children);
    if (found) return found;
  }
  return null;
}
function findNode(id){ const r = locate(id); return r ? r.node : null; }
function countAll(nodes){ let c=0; nodes.forEach(n=>{ c+=1; c+=countAll(n.children); }); return c; }
function toast(msg){

  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ---- voice input: browser Web Speech API, or Groq Whisper API ---- */
let voiceRecognition = null;
let voiceRecognizingKey = null;
let groqMediaRecorder = null;
let groqStream = null;
let groqAudioChunks = [];
let groqSegmentTimer = null;
let groqCtx = null;
const GROQ_SEGMENT_MS = 12000; // auto-split into short chunks: fast feedback + no single upload ever too big/long

function getSRCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
function loadGroqKey(){ try{ return localStorage.getItem('mindmap_groq_key') || ''; }catch(e){ return ''; } }
function saveGroqKeyToStorage(key){ try{ localStorage.setItem('mindmap_groq_key', key); }catch(e){} }

function stopVoiceInput(){
  voiceRecognizingKey = null; // mark first so any in-flight onend/onstop handlers know not to auto-restart
  if (voiceRecognition){
    try{ voiceRecognition.onend = null; voiceRecognition.stop(); }catch(e){}
  }
  voiceRecognition = null;
  clearTimeout(groqSegmentTimer);
  if (groqMediaRecorder && groqMediaRecorder.state !== 'inactive'){
    try{ groqMediaRecorder.onstop = null; groqMediaRecorder.stop(); }catch(e){}
  }
  // Note: the persistent groqStream (mic permission) is intentionally NOT stopped
  // here, so switching tabs / re-rendering doesn't force the browser to re-prompt
  // for microphone access on the next recording. It's released via releaseGroqStream().
  groqMediaRecorder = null; groqAudioChunks = []; groqCtx = null;
  document.querySelectorAll('.voice-btn.recording, .voice-btn.transcribing').forEach(btn=>{
    btn.classList.remove('recording'); btn.classList.remove('transcribing');
  });
}
function releaseGroqStream(){
  if (groqStream){ try{ groqStream.getTracks().forEach(t=>t.stop()); }catch(e){} }
  groqStream = null;
}
async function ensureGroqStream(){
  if (groqStream && groqStream.getAudioTracks().some(t=>t.readyState==='live')) return groqStream;
  groqStream = await navigator.mediaDevices.getUserMedia({audio:true});
  return groqStream;
}
function startVoiceInput(key, getCurrentText, setText, btnEl){
  if (state.voiceProvider === 'groq'){ startGroqVoiceInput(key, getCurrentText, setText, btnEl); return; }
  const Ctor = getSRCtor();
  if (!Ctor){ toast('当前浏览器不支持语音输入，建议用电脑版 Chrome / Edge 浏览器，或在下方切换到 Groq 云端识别'); return; }
  if (voiceRecognizingKey === key){ stopVoiceInput(); return; }
  stopVoiceInput();
  if (window.isSecureContext===false){
    toast('当前页面不是安全上下文（比如直接双击打开的本地文件），浏览器自带的语音识别很可能无法使用，建议在下方切换到 Groq 云端识别');
  }

  const baseText = getCurrentText() || '';
  let finalTranscript = '';
  let restartCount = 0;
  let networkErrorStreak = 0;
  let gotAnyResult = false;
  voiceRecognizingKey = key;
  btnEl.classList.add('recording');

  const giveUp = (msg)=>{
    toast(msg);
    setText(baseText + finalTranscript);
    btnEl.classList.remove('recording');
    voiceRecognizingKey = null; voiceRecognition = null;
  };

  // Reuse a single SpeechRecognition instance across auto-restarts (instead of
  // creating a fresh one each time) — repeatedly constructing new instances is
  // what was triggering the browser's microphone-permission dialog again and
  // again; restarting the same instance does not.
  const rec = new Ctor();
  voiceRecognition = rec;
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (event)=>{
    gotAnyResult = true;
    restartCount = 0;
    networkErrorStreak = 0;
    let interim = '';
    for (let i=event.resultIndex; i<event.results.length; i++){
      const res = event.results[i];
      if (res.isFinal) finalTranscript += res[0].transcript;
      else interim += res[0].transcript;
    }
    setText(baseText + finalTranscript + interim);
  };
  rec.onerror = (e)=>{
    console.error(e);
    if (e.error==='not-allowed' || e.error==='service-not-allowed'){
      giveUp('无法使用麦克风，请检查浏览器的麦克风权限设置');
    } else if (e.error==='network'){
      networkErrorStreak++;
    } else if (e.error!=='no-speech' && e.error!=='aborted'){
      toast('浏览器语音识别出错：'+e.error+'，如持续出错可在下方切换到 Groq 云端识别');
    }
  };
  rec.onend = ()=>{
    if (voiceRecognizingKey !== key) return; // stopped externally (tab switch / manual stop)
    if (networkErrorStreak >= 2){
      giveUp('浏览器语音识别始终无法连接（网络错误），当前浏览器/网络环境可能不支持，请在下方切换到 Groq 云端识别');
      return;
    }
    restartCount++;
    if (restartCount > 30 || (!gotAnyResult && restartCount > 2)){
      giveUp('浏览器语音识别没有反应，建议在下方切换到 Groq 云端识别再试');
      return;
    }
    // Chrome silently ends continuous recognition after roughly a minute even
    // mid-sentence — relaunch on the SAME instance so long dictations keep working.
    setTimeout(()=>{
      if (voiceRecognizingKey !== key) return;
      try{ rec.start(); }
      catch(err){ console.error(err); giveUp('语音识别重启失败，请重试'); }
    }, 250);
  };
  try{ rec.start(); }
  catch(err){
    console.error(err);
    toast('语音识别启动失败，请重试');
    btnEl.classList.remove('recording');
    voiceRecognizingKey = null; voiceRecognition = null;
  }
}
async function startGroqVoiceInput(key, getCurrentText, setText, btnEl){
  if (voiceRecognizingKey === key){
    // user-intentional full stop
    voiceRecognizingKey = null;
    clearTimeout(groqSegmentTimer);
    if (groqMediaRecorder && groqMediaRecorder.state !== 'inactive') groqMediaRecorder.stop();
    else btnEl.classList.remove('recording');
    return;
  }
  if (voiceRecognizingKey){ stopVoiceInput(); }
  if (!state.groqApiKey.trim()){ toast('请先填写 Groq API Key'); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast('当前浏览器不支持录音功能'); return; }

  let stream;
  try{ stream = await ensureGroqStream(); }
  catch(err){ console.error(err); toast('无法访问麦克风，请检查权限设置'); return; }

  voiceRecognizingKey = key;
  btnEl.classList.add('recording');
  groqCtx = { getCurrentText, setText, btnEl, stream, base: getCurrentText()||'' };
  beginGroqSegment();
}
function beginGroqSegment(){
  if (!voiceRecognizingKey || !groqCtx) return;
  groqAudioChunks = [];
  const mimeType = (window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
  const recorder = mimeType ? new MediaRecorder(groqCtx.stream, {mimeType}) : new MediaRecorder(groqCtx.stream);
  groqMediaRecorder = recorder;
  recorder.ondataavailable = (e)=>{ if (e.data && e.data.size>0) groqAudioChunks.push(e.data); };
  recorder.onstop = onGroqSegmentStop;
  recorder.start();
  clearTimeout(groqSegmentTimer);
  groqSegmentTimer = setTimeout(()=>{
    // auto-rotate: finish this ~25s chunk and immediately begin the next one,
    // so a long dictation never becomes one huge/slow upload.
    if (groqMediaRecorder && groqMediaRecorder.state !== 'inactive') groqMediaRecorder.stop();
  }, GROQ_SEGMENT_MS);
}
async function onGroqSegmentStop(){
  clearTimeout(groqSegmentTimer);
  const chunks = groqAudioChunks;
  const mime = (groqMediaRecorder && groqMediaRecorder.mimeType) || 'audio/webm';
  groqAudioChunks = [];
  const ctx = groqCtx;
  const shouldContinue = !!voiceRecognizingKey;

  // Start recording the next segment immediately (if still recording) so no
  // speech is lost while this segment's audio is uploaded/transcribed —
  // transcription happens in the background, in parallel with the next chunk.
  if (shouldContinue) beginGroqSegment();

  if (ctx && chunks.length && chunks.some(c=>c.size>0)){
    if (ctx.btnEl) ctx.btnEl.classList.add('transcribing');
    try{
      const blob = new Blob(chunks, {type: mime});
      const text = await transcribeWithGroq(blob, mime);
      if (text){ ctx.base = ctx.base + text; ctx.setText(ctx.base); }
    } catch(err){
      console.error(err);
      toast('Groq 识别失败：'+(err.message||'请检查 API Key 或网络'));
    } finally {
      if (ctx.btnEl) ctx.btnEl.classList.remove('transcribing');
    }
  }
  if (!shouldContinue){
    if (ctx && ctx.btnEl) ctx.btnEl.classList.remove('recording');
    groqMediaRecorder = null;
    groqCtx = null;
  }
}
function extForMime(mime){
  if (!mime) return 'webm';
  if (mime.indexOf('webm')>=0) return 'webm';
  if (mime.indexOf('ogg')>=0) return 'ogg';
  if (mime.indexOf('mp4')>=0 || mime.indexOf('m4a')>=0) return 'mp4';
  if (mime.indexOf('wav')>=0) return 'wav';
  if (mime.indexOf('mpeg')>=0 || mime.indexOf('mp3')>=0) return 'mp3';
  return 'webm';
}
async function callGroqTranscribe(blob, mime, model){
  const form = new FormData();
  form.append('file', blob, 'audio.'+extForMime(mime));
  form.append('model', model);
  form.append('language', 'zh');
  form.append('response_format', 'json');
  let res;
  try{
    res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method:'POST',
      headers:{ 'Authorization': 'Bearer '+state.groqApiKey.trim() },
      body: form
    });
  } catch(networkErr){
    console.error(networkErr);
    const hint = (location.protocol==='file:')
      ? '，当前页面是直接打开的本地文件（file://），很可能被浏览器或接口拦截了跨域请求——建议把这个 html 文件放到任意可用网址（http/https）访问的地方再打开使用'
      : '，请检查网络连接';
    const err = new Error('无法连接 Groq 服务器'+hint);
    throw err;
  }
  if (!res.ok){
    const errText = await res.text().catch(()=>'');
    const err = new Error('接口返回 '+res.status+'，'+errText.slice(0,150));
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  return (data.text||'').trim();
}
async function transcribeWithGroq(blob, mime){
  try{
    return await callGroqTranscribe(blob, mime, 'whisper-large-v3-turbo');
  }catch(err){
    // if the turbo model name is unavailable/renamed on this account, fall
    // back to the standard whisper model instead of failing outright
    if (err.status===400 || err.status===404){
      return await callGroqTranscribe(blob, mime, 'whisper-large-v3');
    }
    throw err;
  }
}

function pdfLinesFromTextContent(items){
  // Group text items into lines by their vertical (baseline) position, then
  // order items left-to-right within each line — getTextContent() returns
  // items in content-stream order, not visual reading order. Keeps each
  // line's left x-position (for outline depth) and a top-to-bottom rank
  // (for figuring out which parent a line belongs to).
  const rows = [];
  items.forEach(it=>{
    if (!it.str) return;
    const y = it.transform[5];
    let row = rows.find(r=> Math.abs(r.y - y) < 3);
    if (!row){ row = {y, items:[]}; rows.push(row); }
    row.items.push(it);
  });
  rows.sort((a,b)=> b.y - a.y); // top of page first (pdf coords: y grows upward)
  return rows.map((r,i)=>{
    r.items.sort((a,b)=> a.transform[4] - b.transform[4]);
    const text = r.items.map(it=>it.str).join('').replace(/\s+/g,' ').trim();
    const x = Math.min(...r.items.map(it=>it.transform[4]));
    return {text, x, rank:i};
  }).filter(r=> r.text.length>0);
}
function ocrRowsFromWords(words){
  // Same idea as pdfLinesFromTextContent but for Tesseract word boxes
  // (top-left origin, y grows downward), used when the PDF has no text
  // layer at all (e.g. an exported/scanned image-only PDF).
  const valid = (words||[]).filter(w=> w.text && w.text.trim());
  if (!valid.length) return [];
  const avgH = valid.reduce((s,w)=> s+(w.bbox.y1-w.bbox.y0), 0)/valid.length || 12;
  const tol = Math.max(4, avgH*0.5);
  const rows = [];
  valid.forEach(w=>{
    const midY = (w.bbox.y0+w.bbox.y1)/2;
    let row = rows.find(r=> Math.abs(r.midY-midY) < tol);
    if (!row){ row = {midY, items:[]}; rows.push(row); }
    row.items.push(w);
  });
  rows.sort((a,b)=> a.midY - b.midY); // top of page first
  return rows.map((r,i)=>{
    r.items.sort((a,b)=> a.bbox.x0 - b.bbox.x0);
    const text = r.items.map(w=>w.text.trim()).join('').replace(/\s+/g,'').trim();
    const x = Math.min(...r.items.map(w=>w.bbox.x0));
    return {text, x, rank:i};
  }).filter(r=> r.text.length>0);
}
async function extractPdfOutlineLines(file, onProgress){
  if (typeof pdfjsLib === 'undefined'){
    throw new Error('PDF 解析库未能加载，请检查网络连接后重试');
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const perPage = [];
  let hasRealText = false;
  for (let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rows = pdfLinesFromTextContent(content.items);
    if (rows.length) hasRealText = true;
    perPage.push({page, rows});
  }
  const appendWithRunningRank = (lines, rows)=>{
    const offset = lines.length ? lines[lines.length-1].rank+1 : 0;
    rows.forEach(r=> lines.push({text:r.text, x:r.x, rank:r.rank+offset}));
  };
  if (hasRealText){
    const lines = [];
    perPage.forEach(g=> appendWithRunningRank(lines, g.rows));
    return {lines, usedOcr:false};
  }
  // No embedded text layer at all — this is an image/scanned PDF (this is
  // also what happens with a mind map that was exported from this very
  // tool, since that export flattens the diagram to a picture). Fall back
  // to on-device OCR so it can still be imported.
  if (typeof Tesseract === 'undefined'){
    throw new Error('这个 PDF 没有可提取的文字层（可能是图片或扫描版），且 OCR 识别库未能加载，请检查网络连接后重试');
  }
  if (onProgress) onProgress('这个 PDF 没有文字层，正在用 OCR 识别图片中的文字，可能需要一点时间…');
  const worker = await Tesseract.createWorker('chi_sim');
  const lines = [];
  try{
    for (let i=0; i<perPage.length; i++){
      if (onProgress) onProgress(`正在 OCR 识别第 ${i+1}/${perPage.length} 页…`);
      const page = perPage[i].page;
      const viewport = page.getViewport({scale:2.5});
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      const ctx = canvas.getContext('2d');
      await page.render({canvasContext:ctx, viewport}).promise;
      const ret = await worker.recognize(canvas);
      appendWithRunningRank(lines, ocrRowsFromWords((ret.data && ret.data.words) || []));
    }
  } finally {
    await worker.terminate();
  }
  return {lines, usedOcr:true};
}

/* ---- reconstruct outline hierarchy from a flat list of {text, x, rank}
   lines (rank = top-to-bottom reading order). Depth comes from each line's
   left indent (x), clustered into columns. Parent/child pairing is done
   per level by nearest reading-order rank rather than a simple top-down
   stack, because this tool's OWN diagram export vertically centers a
   parent label among its children (via the brace connector layout) —
   so a parent line often reads AFTER some of its children, not before
   them. Nearest-rank matching handles that; a plain indentation stack
   would misattach nodes on exactly this kind of PDF. ---- */
function stripOutlinePrefix(text){
  return text
    .replace(/^\d+[、.．]\s*/, '')
    .replace(/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]\s*/, '')
    .replace(/^[（(]\d+[）)]\s*/, '')
    .replace(/^[A-Za-z]+[、.．]\s*/, '')
    .trim();
}
function detectVerticalTitle(lines){
  // The diagram's own title renders top-to-bottom, one character per line,
  // in the leftmost column (writing-mode: vertical-rl). Detect that
  // pattern so it becomes the document title instead of a pile of
  // one-character nodes.
  if (!lines.length) return {title:null, rest:lines};
  const minX = Math.min(...lines.map(l=>l.x));
  const atMinX = lines.filter(l=> Math.abs(l.x-minX)<=12);
  const shortOnes = atMinX.filter(l=> Array.from(l.text).length<=2);
  if (atMinX.length>=3 && shortOnes.length===atMinX.length){
    const sorted = atMinX.slice().sort((a,b)=>a.rank-b.rank);
    const title = sorted.map(l=>l.text).join('');
    const rest = lines.filter(l=> !atMinX.includes(l));
    return {title, rest};
  }
  return {title:null, rest:lines};
}
function clusterLevels(lines){
  if (!lines.length) return [];
  const xs = lines.map(l=>l.x);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const span = Math.max(1, maxX-minX);
  const gapThreshold = Math.max(10, span*0.04);
  const sortedX = Array.from(new Set(xs)).sort((a,b)=>a-b);
  const clusters = [];
  sortedX.forEach(x=>{
    const last = clusters[clusters.length-1];
    if (!last || x-last.max > gapThreshold) clusters.push({min:x, max:x});
    else last.max = x;
  });
  return lines.map(l=>{
    let idx = 0;
    for (let i=0;i<clusters.length;i++){
      if (l.x >= clusters[i].min-0.01 && l.x <= clusters[i].max+gapThreshold) idx = i;
    }
    return Math.min(5, idx+1);
  });
}
function buildTreeFromLines(lines){
  const levels = clusterLevels(lines);
  const prepared = lines.map((l,i)=>({rank:l.rank, level:levels[i], text:stripOutlinePrefix(l.text)})).filter(l=> l.text);
  if (!prepared.length) return [];
  const maxLevel = Math.max(...prepared.map(l=>l.level));
  const roots = [];
  let parentPool = null; // nodes of the deepest level seen so far, for nearest-rank matching
  for (let lv=1; lv<=maxLevel; lv++){
    const items = prepared.filter(l=>l.level===lv).sort((a,b)=>a.rank-b.rank);
    if (!items.length) continue; // this exact level has no lines — keep parentPool as-is
    const current = items.map(it=>{
      const node = newNode(lv, escapeHtml(it.text));
      if (lv===1 || !parentPool || !parentPool.length){
        roots.push(node);
      } else {
        let best = null, bestDist = Infinity;
        parentPool.forEach(p=>{ const d = Math.abs(p.rank-it.rank); if (d<bestDist){ bestDist=d; best=p; } });
        best.node.children.push(node);
      }
      return {rank: it.rank, node};
    });
    parentPool = current;
  }
  return roots;
}
function buildOutlineFromLines(rawLines){
  const {title, rest} = detectVerticalTitle(rawLines);
  const roots = buildTreeFromLines(rest);
  return {title, roots};
}

async function tryReadEmbeddedMindmapData(file){
  if (typeof pdfjsLib === 'undefined') return null;
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const meta = await pdf.getMetadata();
    const kw = meta && meta.info && meta.info.Keywords;
    if (typeof kw === 'string' && kw.indexOf(MINDMAP_EMBED_MARKER)===0){
      const json = decodeURIComponent(escape(atob(kw.slice(MINDMAP_EMBED_MARKER.length))));
      const payload = JSON.parse(json);
      const nodes = nodesFromPlain(payload.nodes || []);
      return {title: payload.title || '', nodes};
    }
  }catch(err){ console.error(err); }
  return null;
}
function applyImportedOutline(title, roots, successMessage){
  if (!roots || !roots.length){
    toast('未能从这个 PDF 中识别出可用内容');
    return;
  }
  const hasExisting = state.nodes.length>0;
  const append = hasExisting ? confirm('已有内容，点击"确定"将导入内容追加到末尾，点击"取消"则替换现有全部内容。') : true;
  if (!append) state.nodes = [];
  state.nodes.push(...roots);
  if (title && !append) state.title = title;
  state.editView = 'input';
  toast(successMessage);
}
async function importPdfFile(file){
  if (!/\.pdf$/i.test(file.name) && file.type!=='application/pdf'){
    toast('请选择 PDF 文件'); return;
  }
  state.pdfImporting = true; render();
  try{
    // Best case: this PDF was exported by this very tool, so the exact
    // original outline is embedded in it — use that directly rather than
    // re-deriving structure from the flattened picture.
    const embedded = await tryReadEmbeddedMindmapData(file);
    if (embedded && embedded.nodes.length){
      applyImportedOutline(embedded.title, embedded.nodes,
        `这个 PDF 是本工具导出的，已精确还原 ${countAll(embedded.nodes)} 项内容，层级与原图完全一致`);
      return;
    }
    // Otherwise: pull text (with OCR fallback for image-only PDFs) and
    // reconstruct an approximate hierarchy from each line's indentation.
    const {lines, usedOcr} = await extractPdfOutlineLines(file, (msg)=> toast(msg));
    if (!lines.length){
      toast('未能从这个 PDF 中识别出文字，换一个文件试试');
      return;
    }
    const {title, roots} = buildOutlineFromLines(lines);
    const count = countAll(roots);
    applyImportedOutline(title, roots,
      `已导入 ${count} 项内容，层级是根据文字缩进位置智能推测的${usedOcr?'（并用 OCR 识别了图片中的文字，可能有误）':''}，请检查并按需调整`);
  } catch(err){
    console.error(err);
    toast('PDF 解析失败：'+(err.message||'请重试或更换文件'));
  } finally {
    state.pdfImporting = false;
    render();
  }
}

function renderInputNode(node, idx){

  });

  line.appendChild(mini);

  }
  return wrap;
}

  const childEls = node.children.length ? node.children.map((c,i)=>renderRecitePickNode(c,i)) : [];

function cloneForRecite(node){

/* Shared read-only renderer used by recite view, blank practice, AND export,
   so they always match the diagram view.
   useBlanks: read persisted blank markup for label/note instead of raw content.
   normalizeBlanks: force all blanks to their hidden (unrevealed) state — used for export. */
function renderStaticNode(node, idx, isRecite, useBlanks, normalizeBlanks){
  const labelBlock = el('div',{class:`label-block lvl-${node.level}`});
  const line = el('div',{class:'label-line'});
  const prefix = numberPrefix(node.level, idx);
  if (prefix) line.appendChild(el('span',{class:'num-prefix', style:{fontSize:node.fontSize+'px'}}, prefix));

  if (isRecite && node.hidden){
    const wrapSpan = el('span',{class:'label-text', style:{fontSize:node.fontSize+'px'}});
    wrapSpan.appendChild(makeBlankSpan(stripHtml(node.html) || '　'));
    line.appendChild(wrapSpan);
  } else {
    let labelHtml = node.html;
    if (useBlanks && state.blankHtml[node.id] !== undefined){
      labelHtml = normalizeBlanks ? normalizeBlanksForExport(state.blankHtml[node.id]) : state.blankHtml[node.id];
    }
    line.appendChild(el('span',{class:'label-text', 'data-id':node.id, style:{fontSize:node.fontSize+'px'}, html:labelHtml}));
  }
  labelBlock.appendChild(line);

  if (node.note && node.note.trim()){
    let noteHtml = escapeHtml(node.note.trim());
    if (useBlanks && state.blankNoteHtml[node.id] !== undefined){
      noteHtml = normalizeBlanks ? normalizeBlanksForExport(state.blankNoteHtml[node.id]) : state.blankNoteHtml[node.id];
    }
    labelBlock.appendChild(el('div',{class:'node-note', 'data-id':node.id, html:noteHtml}));
  }

  const childEls = (node.children && node.children.length) ? node.children.map((c,i)=>renderStaticNode(c,i,isRecite,useBlanks,normalizeBlanks)) : [];
  return buildBraceRow(labelBlock, childEls);
}

/* ---- fill-in-the-blank (cloze) practice ---- */
// Blanks/restores change a label's text content (and therefore its wrapped
// width/height) without going through the normal render() → layoutConnectors()
// pass, since they mutate the DOM in place to preserve scroll position and
// text selection. Left alone, the brace connector SVGs keep their old height
// and visibly drift out of alignment with the rows they're supposed to
// bracket. Call this after any such in-place edit to resync them.
function relayoutTree(fromEl){
  const root = fromEl && fromEl.closest ? fromEl.closest('.tree-root') : null;
  if (root) layoutConnectors(root);
}
function bindBlankSlot(span){
  if (span._bound) return;
  span._bound = true;
  span.addEventListener('click', ()=>{
    const revealed = span.dataset.revealed === 'true';
    span.dataset.revealed = revealed ? 'false' : 'true';
    span.classList.toggle('revealed', !revealed);
    span.textContent = !revealed ? span.dataset.answer : '';
    relayoutTree(span);
  });
}
function makeBlankSpan(text){
  const len = Array.from(text).length;
  const span = el('span',{class:'blank-slot', title:'点击查看/隐藏答案'});
  span.dataset.answer = text;
  span.dataset.revealed = 'false';
  span.style.minWidth = Math.max(2, Math.min(16, len)) + 'em';
  bindBlankSlot(span);
  return span;
}
function bindBlankRestore(btn){
  if (btn._bound) return;
  btn._bound = true;
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const wrap = btn.closest('.blank-wrap');
    if (!wrap) return;
    const slot = wrap.querySelector('.blank-slot');
    const answer = slot ? (slot.dataset.answer||'') : '';
    const parentLabel = wrap.closest('.label-text, .node-note');
    const textNode = document.createTextNode(answer);
    wrap.replaceWith(textNode);
    if (parentLabel) syncBlankHtml(parentLabel);
    relayoutTree(btn);
  });
}
function makeClozeBlank(text){
  const wrap = el('span',{class:'blank-wrap'});
  wrap.appendChild(makeBlankSpan(text));
  const restore = el('span',{class:'blank-restore', title:'恢复为普通文字（取消这一处挖空）'}, '✕');
  bindBlankRestore(restore);
  wrap.appendChild(restore);
  return wrap;
}
function doBlankSelection(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount===0){ toast('请先选中要挖空的文字'); return; }
  const range = sel.getRangeAt(0);
  const text = range.toString();
  if (!text.trim()){ toast('请选中要挖空的文字'); return; }
  const closestTarget = (node)=>{
    const elNode = node.nodeType===3 ? node.parentElement : node;
    return elNode && elNode.closest ? elNode.closest('.label-text, .node-note') : null;
  };
  const startTarget = closestTarget(range.startContainer);
  const endTarget = closestTarget(range.endContainer);
  if (!startTarget || !endTarget || startTarget!==endTarget || !startTarget.closest('.practice-tree')){
    toast('请在同一段文字（或同一条备注）内选中要挖空的内容'); return;
  }
  const blank = makeClozeBlank(text);
  range.deleteContents();
  range.insertNode(blank);
  sel.removeAllRanges();
  syncBlankHtml(startTarget);
  relayoutTree(startTarget);
}
function syncBlankHtml(targetEl){
  const id = targetEl.dataset.id;
  if (!id) return;
  if (targetEl.classList.contains('node-note')) state.blankNoteHtml[id] = targetEl.innerHTML;
  else state.blankHtml[id] = targetEl.innerHTML;
}

async function generateExplanation(id){
  const item = state.glossary.find(g=>g.id===id);
  if (!item) return;
  if (!item.term.trim()){ toast('请先输入名词'); return; }
  if (!state.deepseekKey.trim()){ toast('请先在上方填写 DeepSeek API Key'); return; }
  item.loading = true; render();
  try{
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+state.deepseekKey.trim()},
      body: JSON.stringify({
        model:'deepseek-chat',
        messages:[
          {role:'system', content:'你是历史与通识学习助手，请用简洁准确、适合做背诵笔记的语言解释用户给出的名词或概念，中文作答，控制在120字以内，不要使用markdown符号。'},
          {role:'user', content: item.term.trim()}
        ],
        temperature:0.3
      })
    });
    if (!res.ok){
      const errText = await res.text().catch(()=>'');
      throw new Error('接口返回 '+res.status+'，'+errText.slice(0,150));
    }
    const data = await res.json();
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!content) throw new Error('未返回有效内容');
    item.explanation = content.trim();
  } catch(err){
    console.error(err);
    toast('生成失败：'+(err.message||'请检查网络、API Key，或浏览器是否阻止了跨域请求'));
  } finally {
    item.loading = false;
    render();
  }
}

      // carry extra copies of that data and burn through localStorage's
      // limited quota much faster, which was silently blocking new saves.
      reciteHidden: src==='recite' ? JSON.parse(JSON.stringify(state.reciteHidden)) : {},
      reciteTree: (src==='recite' && state.reciteTree) ? JSON.parse(JSON.stringify(state.reciteTree)) : null,
      blankHtml: src==='blank' ? JSON.parse(JSON.stringify(state.blankHtml)) : {},
      blankNoteHtml: src==='blank' ? JSON.parse(JSON.stringify(state.blankNoteHtml)) : {}
    }
  };
  state.history.unshift(rec);
  const ok = saveJSON('mindmap_history', state.history);
  if (!ok){
    state.history.shift();
    toast('本机浏览器存储空间已满（不是重名限制），这条记录没能保存。请到"导出记录"里删除一些旧记录或清空整个文件夹后再导出。');
  }
}
function estimateHistoryKB(){
  try{ return Math.round(JSON.stringify(state.history).length/1024); }catch(e){ return 0; }
}
function bumpIdCounterDeep(nodes){
  nodes.forEach(n=>{ bumpIdCounterFromId(n.id); bumpIdCounterDeep(n.children||[]); });
}
function restoreHistoryRecord(id){
  const rec = state.history.find(h=>h.id===id);
  if (!rec) return;
  if (!confirm('导入后将覆盖当前编辑内容，确定要导入这条导出记录吗？')) return;
  state.title = rec.data.title;
  state.nodes = JSON.parse(JSON.stringify(rec.data.nodes));
  state.glossary = JSON.parse(JSON.stringify(rec.data.glossary||[]));
  state.reciteHidden = JSON.parse(JSON.stringify(rec.data.reciteHidden||{}));
  state.reciteTree = rec.data.reciteTree ? JSON.parse(JSON.stringify(rec.data.reciteTree)) : null;
  state.blankHtml = JSON.parse(JSON.stringify(rec.data.blankHtml||{}));
  state.blankNoteHtml = JSON.parse(JSON.stringify(rec.data.blankNoteHtml||{}));
  bumpIdCounterDeep(state.nodes);
  state.glossary.forEach(g=>bumpIdCounterFromId(g.id));
  state.exportTitle = rec.title;
  state.exportSource = rec.source || 'full';
  const src = rec.source || 'full';
  if (src==='glossary'){
    state.tab = 'glossary';
  } else if (src==='recite'){
    state.tab = 'recite'; state.reciteSection = 'depth';
    state.reciteMode = state.reciteTree ? 'view' : 'setup';
  } else if (src==='blank'){
    state.tab = 'recite'; state.reciteSection = 'blank';
  } else {
    state.tab = 'edit'; state.editView = 'diagram';
  }
  document.getElementById('docTitle').textContent = state.title;
  render();
  toast('已导入该导出记录（对应部分）');
}
function deleteHistoryRecord(id){
  if (!confirm('确定删除这条导出记录吗？')) return;
  state.history = state.history.filter(h=>h.id!==id);
  saveJSON('mindmap_history', state.history);
  render();
}

function buildGlossaryDocWrapper(){
  const wrapper = el('div',{style:{
    width:'700px', background:'#fff', position:'relative', padding:'48px 56px', boxSizing:'border-box',
    fontFamily:'-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif', color:'#232019'
  }});
  wrapper.appendChild(el('h1',{style:{fontFamily:'"Songti SC","STSong",Georgia,serif', fontSize:'24px', margin:'0 0 22px', borderBottom:'2px solid #E4DECF', paddingBottom:'12px'}}, state.exportTitle||'名词解释'));
  state.glossary.forEach((item,i)=>{
    const block = el('div',{style:{marginTop: i===0?'0':'16px', paddingTop:i===0?'0':'14px', borderTop:i===0?'none':'1px dashed #E4DECF'}});
    block.appendChild(el('div',{style:{fontWeight:'700', fontSize:'16px', marginBottom:'6px'}}, item.term||'（未命名）'));
    block.appendChild(el('div',{style:{fontSize:'13.5px', lineHeight:'1.8', color:'#3A362C', whiteSpace:'pre-wrap'}}, item.explanation||'（暂无解释）'));
    wrapper.appendChild(block);
  });
  return wrapper;
}
function buildDocWrapper(){
  if (state.exportSource==='glossary') return buildGlossaryDocWrapper();
  const wrapper = el('div',{style:{
    display:'inline-block', position:'relative', background:'#fff', padding:'48px 56px',
    fontFamily:'-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
    color:'#232019', boxSizing:'border-box'
  }});
  let nodes = state.nodes, isRecite=false, useBlanks=false, normalizeBlanks=false;
  if (state.exportSource==='recite' && state.reciteTree){ nodes = state.reciteTree; isRecite = true; }
  else if (state.exportSource==='blank'){ nodes = state.nodes; useBlanks = true; normalizeBlanks = true; }
  const topRows = nodes.map((n,i)=>renderStaticNode(n,i,isRecite,useBlanks,normalizeBlanks));
  wrapper.appendChild(buildRootRow(state.exportTitle, topRows));
  return wrapper;
}
function addWatermarks(wrapper, numPages, sliceHpx, contentW){
  if (!state.watermarkEnabled || !state.watermarkText.trim()) return;
  for (let p=0;p<numPages;p++){
    const wm = el('div',{style:{
      position:'absolute', left:'50%', top:(p*sliceHpx + sliceHpx/2)+'px',
      transform:'translate(-50%,-50%) rotate(-30deg)', color:'#9CA3AF', opacity:'0.16',
      fontWeight:'700', whiteSpace:'nowrap', pointerEvents:'none', fontSize:'40px'
    }}, state.watermarkText.trim());
    wrapper.appendChild(wm);
    const targetW = contentW*0.6;
    const w0 = wm.offsetWidth || 1;
    wm.style.fontSize = Math.max(10, 40*(targetW/w0)) + 'px';
  }
}
function buildHiddenDoc(){
  const holder = el('div',{id:'hiddenExportHolder', style:{position:'fixed', left:'-10000px', top:'0', zIndex:'-1'}});
  const wrapper = buildDocWrapper();
  holder.appendChild(wrapper);
  document.body.appendChild(holder);
  layoutConnectors(wrapper);
  const contentW = Math.max(wrapper.scrollWidth, 1);
  const contentH = Math.max(wrapper.scrollHeight, 1);
  const landscape = state.exportOrientation==='landscape';
  const pageWmm = landscape ? 297 : 210;
  const pageHmm = landscape ? 210 : 297;
  const mmPerPx = pageWmm / contentW;
  const sliceHpx = pageHmm / mmPerPx;
  const numPages = Math.max(1, Math.ceil(contentH / sliceHpx));
  addWatermarks(wrapper, numPages, sliceHpx, contentW);
  return {holder, wrapper, numPages, sliceHpx, mmPerPx, pageWmm, pageHmm};
}
async function buildPageImages(){
  const {holder, wrapper, numPages, sliceHpx, mmPerPx, pageWmm} = buildHiddenDoc();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const scale = 2;
  const canvas = await html2canvas(wrapper, {scale, backgroundColor:'#ffffff', useCORS:true});
  const sliceHcanvas = sliceHpx*scale;
  const pages = [];
  for (let p=0; p<numPages; p++){
    const startY = p*sliceHcanvas;
    const remaining = canvas.height - startY;
    const h = Math.min(sliceHcanvas, remaining);
    if (h<=0) break;
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = canvas.width;
    pageCanvas.height = h;
    const ctx = pageCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
    ctx.drawImage(canvas, 0, startY, canvas.width, h, 0, 0, canvas.width, h);
    pages.push({dataUrl: pageCanvas.toDataURL('image/jpeg',0.92), mmH:(h/scale)*mmPerPx});
  }
  holder.remove();
  return {pages, pageWmm};
}
async function doPreview(){
  toast('正在生成预览…');
  let result;
  try{ result = await buildPageImages(); } catch(err){ console.error(err); toast('预览生成失败，请重试'); return; }
  const {pages, pageWmm} = result;
  const overlay = el('div',{class:'modal-overlay', onclick:(e)=>{ if(e.target===overlay) closeModal(); }});
  const box = el('div',{class:'modal-box'});
  box.appendChild(el('div',{class:'modal-head'},[
    el('h3',{},`预览 · 共 ${pages.length} 页（与导出的 PDF 完全一致）`),
    el('button',{class:'btn ghost small', onclick:()=>closeModal()}, '✕ 关闭')
  ]));
  const body = el('div',{class:'modal-body'});
  const imgWidth = pageWmm>210 ? 560 : 420;
  pages.forEach(pg=>{
    const frame = el('div',{class:'doc-page-frame'});
    frame.appendChild(el('img',{src:pg.dataUrl, style:{display:'block', width:imgWidth+'px', maxWidth:'82vw', height:'auto'}}));
    body.appendChild(frame);
  });
  box.appendChild(body);
  box.appendChild(el('div',{class:'modal-foot'},[
    el('button',{class:'btn primary', onclick:()=>{ closeModal(); doExportPDF(); }}, '⬇ 导出为 PDF')
  ]));
  overlay.appendChild(box);
  document.getElementById('modalRoot').appendChild(overlay);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

async function doExportPDF(){
  toast('正在生成 PDF…');
  try{
    const {pages, pageWmm} = await buildPageImages();
    const { jsPDF } = window.jspdf;
    const landscape = state.exportOrientation==='landscape';
    // Use the legacy positional constructor (orientation, unit, format) — the most
    // widely-compatible jsPDF call signature — with an explicit orientation string
    // AND an explicit [width,height] array, so orientation can't be silently ignored.
    const pdf = new jsPDF(landscape ? 'l' : 'p', 'mm', landscape ? [297,210] : [210,297]);
    pages.forEach((pg,i)=>{
      if (i>0) pdf.addPage();
      pdf.addImage(pg.dataUrl, 'JPEG', 0, 0, pageWmm, pg.mmH);
    });
    // Embed the full underlying outline (not just whichever view got
    // rendered to pixels) as hidden PDF metadata, so this exact file can
    // later be re-imported via "导入 PDF" with the hierarchy restored
    // perfectly — no text/OCR guessing needed for PDFs this tool made.
    try{
      const payload = {title: state.title, nodes: serializeNodesForEmbed(state.nodes)};
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      pdf.setProperties({
        title: state.exportTitle || state.title,
        keywords: MINDMAP_EMBED_MARKER + encoded
      });
    }catch(embedErr){ console.error(embedErr); /* non-fatal — PDF still exports fine without round-trip data */ }
    pdf.save((state.exportTitle || '思维导图') + '.pdf');
    pushHistoryRecord();
    toast('PDF 已生成，并保存了一条导出记录');
  } catch(err){
    console.error(err);
    toast('导出失败，请重试');
  }
}

/* =========================================================
   Tab wiring / top-level render
   ========================================================= */
function renderTab(){
  stopVoiceInput();
  const vp = document.getElementById('viewport');
  const prevScroller = vp.querySelector('.tree-scroll');
  const prevScroll = prevScroller ? {left:prevScroller.scrollLeft, top:prevScroller.scrollTop} : null;
  vp.innerHTML='';
  if (state.tab==='edit') vp.appendChild(renderEditTab());
  else if (state.tab==='recite') vp.appendChild(renderReciteTab());
  else if (state.tab==='glossary') vp.appendChild(renderGlossaryTab());
  else if (state.tab==='export') vp.appendChild(renderExportTab());
  document.querySelectorAll('.tab').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===state.tab); });
  const tr = vp.querySelector('.tree-root');
  if (tr) layoutConnectors(tr);
  const newScroller = vp.querySelector('.tree-scroll');
  if (newScroller && prevScroll){
    newScroller.scrollLeft = prevScroll.left;
    newScroller.scrollTop = prevScroll.top;
  }
}
function render(){ renderTab(); }

document.getElementById('docTitle').textContent = state.title;
document.getElementById('docTitle').addEventListener('blur', (e)=>{
  state.title = e.target.textContent.trim() || '未命名思维导图';
  e.target.textContent = state.title;
  if ((state.tab==='edit' && state.editView==='diagram') || state.tab==='recite') renderTab();
});
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if (!btn) return;
  state.tab = btn.dataset.tab;
  renderTab();
});

renderTab();
window.addEventListener('beforeunload', releaseGroqStream);
</script>
